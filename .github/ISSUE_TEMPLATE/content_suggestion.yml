name: ✍️ Content Suggestion
description: 提议写一篇新文章(概念解读 / 项目深度 / 实战案例)
title: "[Content]: "
labels: ["enhancement", "content", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      content: |
        提议一篇新文章选题!请提供:
        1. 主题和大致内容
        2. 为什么现在值得写
        3. 建议的分类

  - type: input
    id: title
    attributes:
      label: 选题
      description: 文章标题
      placeholder: "ReAct 入门:Reasoning + Acting 协同的范式革命"
    validations:
      required: true

  - type: dropdown
    id: direction
    attributes:
      label: 建议方向
      description: 这篇文章最主要的内容方向
      options:
        - 概念解读(介绍一个核心概念/技术)
        - 资源点评(对一个项目/论文/工具的深度评测)
        - 教程(手把手的实战步骤)
        - 综述(对子领域的全景梳理)
    validations:
      required: true

  - type: input
    id: audience
    attributes:
      label: 目标读者
      description: 这篇文章主要面向谁?他们的背景是什么?
      placeholder: "例:已熟悉 LLM 基础、想了解 KG 增强方案的算法工程师"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 文章分类
      options:
        - 核心概念(深度解读)
        - 核心项目(项目深度)
        - 教程博客(实战教程)
        - 论文综述(论文精读)
        - 应用案例(场景实战)
    validations:
      required: true

  - type: textarea
    id: outline
    attributes:
      label: 大纲
      description: 提议的章节结构
      placeholder: |
        1. 背景:为什么这个主题重要
        2. 核心概念:...
        3. 实现原理:...
        4. 实战案例:...
        5. 下一步
    validations:
      required: true

  - type: textarea
    id: detail-outline
    attributes:
      label: 内容大纲(可选)
      description: 更细的内容规划 — 每个章节的要点、参考链接、示例代码片段等
      placeholder: |
        §1 背景
          - 引用:某论文/某篇文章(URL)
          - 关键数据/案例
        §2 核心概念
          - 配图建议:...
          - 公式:...
    validations:
      required: false

  - type: textarea
    id: motivation
    attributes:
      label: 写作动机
      description: 为什么这个选题值得现在写?填补了什么空白?
    validations:
      required: true

  - type: dropdown
    id: author
    attributes:
      label: 作者
      description: 谁来写?
      options:
        - 我来写(我会在评论中确认)
        - 邀请其他贡献者
        - 由维护者评估
    validations:
      required: true

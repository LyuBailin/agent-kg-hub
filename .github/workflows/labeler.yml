name: PR Labeler

on:
  - pull_request_target

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    name: Auto-label PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply labels based on changed paths
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          fail-on-error: false

      - name: Welcome new contributors
        if: github.event.pull_request.user.login != 'LyuBailin'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const isFirstPR = await github.rest.search.issuesAndPullRequests({
              q: `is:pr author:${author} repo:LyuBailin/agent-kg-hub`
            }).then(res => res.data.total_count === 1);

            if (isFirstPR) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `👋 欢迎 @${author}!感谢提交你的第一个 PR 到 Agent KG Hub。\n\n我会尽快 review。如有问题会在评论中沟通。`
              });
            }

      - name: Auto-assign author as self-assignee
        run: |
          echo "PR author: ${{ github.event.pull_request.user.login }}"

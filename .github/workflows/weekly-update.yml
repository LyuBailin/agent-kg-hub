name: Weekly Update Check

on:
  # 每周一 UTC 00:00 跑(北京时间 8:00)
  schedule:
    - cron: '0 0 * * 1'
  # 允许手动触发
  workflow_dispatch:
  # 每次 push 到 main 也跑(轻量校验)
  push:
    branches: [main]
    paths:
      - '.github/dependabot.yml'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  pull-requests: write
  issues: write          # 创建/更新每周快照 issue 需要
  pages: write           # 部署到 GitHub Pages
  id-token: write        # actions/deploy-pages 走 OIDC 需要

jobs:
  check-deps:
    name: Check Deps & Sync Stars
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Fetch latest releases of tracked projects
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'microsoft/graphrag',
            'langchain-ai/langgraph',
            'huggingface/smolagents',
            'datawhalechina/hello-agents',
            'bytedance/deerflow',
            'arthelokyo/astrowind'
          )
          $summary = @()
          foreach ($p in $projects) {
            try {
              $r = gh api "repos/$p" --jq '{stars: .stargazers_count, pushed: .pushed_at, name: .full_name}'
              if ($LASTEXITCODE -ne 0) { throw "gh api 返回 $LASTEXITCODE" }
              $summary += "[$($r.name)] ★$($r.stars)  last push: $($r.pushed)"
            } catch {
              $summary += "[$p] FETCH FAILED: $_"
            }
          }
          $summary | Out-File -FilePath weekly-stars.txt -Encoding utf8
          Get-Content weekly-stars.txt

      - name: Create/Update tracking issue
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $today = Get-Date -Format "yyyy-MM-dd"
          $lines = (Get-Content weekly-stars.txt) -join "`n"
          $body = "## Weekly Ecosystem Snapshot - $today`n`n$lines`n`n---> 自动生成于每周一 UTC 00:00。维护者请 review 这些项目的活跃度,如发现重大变化请补充资源导航。"

          # 按标题前缀找已存在的快照 issue，避免每周新建；标签只作兜底
          $issues = gh issue list --state open --limit 100 --json number,title | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "gh issue list failed (exit $LASTEXITCODE)" }
          $existing = ($issues | Where-Object { $_.title.StartsWith('[Weekly Snapshot]') } |
            Sort-Object number | Select-Object -First 1).number

          if ($existing) {
            gh issue edit $existing --body $body
            if ($LASTEXITCODE -ne 0) { throw "gh issue edit failed (exit $LASTEXITCODE)" }
            Write-Output "Updated issue #$existing"
          } else {
            gh issue create --title "[Weekly Snapshot] $today" --body $body --label weekly-snapshot
            if ($LASTEXITCODE -ne 0) {
              # 标签被误删时降级：不带标签再建一次，不让整周因为一个标签失败
              gh issue create --title "[Weekly Snapshot] $today" --body $body
              if ($LASTEXITCODE -ne 0) { throw "gh issue create failed (exit $LASTEXITCODE)" }
              Write-Output "Created snapshot issue WITHOUT label (weekly-snapshot 标签缺失)"
            } else {
              Write-Output "Created new snapshot issue"
            }
          }

  auto-rebuild:
    name: Auto Rebuild Site
    runs-on: ubuntu-latest
    # 依赖 Deps 检查通过后跑
    needs: check-deps
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: 'pages'          # 与 pages.yml 共用，避免两次部署撞车
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Build search index with Pagefind
        run: npx pagefind --site dist --output-subdir pagefind

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
